family: llama3.2
models:
  - {id: meta-llama/Llama-3.2-1B-Instruct, size_b: 1.0, batch_size: 32}
  - {id: meta-llama/Llama-3.2-3B-Instruct, size_b: 3.0, batch_size: 16}
precisions: [fp16, int8, nf4]
datasets: [triviaqa]
timing_exclude: []
defaults:
  n_questions: 1500
  subset_seed: 0
  split_seed: 0
  sample_seed: 1
  n_samples: 5
  temperature: 1.0
  max_new_tokens: 32
  layer_fracs: [0.25, 0.5, 0.75, 1.0]
  results_root: results
